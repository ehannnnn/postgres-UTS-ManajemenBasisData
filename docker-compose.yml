services:
  postgres:
    image: postgres:15                 
    container_name: postgres_RaihanDwiyugaFadilah
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}         
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "22075:5432"                    
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dbnet

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_RaihanDwiyugaFadilah
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "44075:80"                     
    depends_on:
      - postgres
    networks:
      - dbnet

volumes:
  pgdata:

networks:
  dbnet: